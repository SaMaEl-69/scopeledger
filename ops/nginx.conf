# Template: obtain and verify the certificate before enabling this HTTPS block.
# Include from nginx's http context. These limits use the direct client address;
# re-evaluate the trusted proxy chain if adding a CDN in front of nginx.
limit_req_zone $binary_remote_addr zone=scopeledger_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=scopeledger_connections:10m;
server {
    listen 80;
    server_name scopeledger.site;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://scopeledger.site$request_uri; }
}
server {
    listen 443 ssl;
    server_name scopeledger.site;
    if ($host != scopeledger.site) { return 444; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/scopeledger.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scopeledger.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Initially short-lived; increase only after HTTPS and recovery are proven.
    # No includeSubDomains or preload commitment for unverified subdomains.
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 3m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 15s;
    limit_conn scopeledger_connections 20;
    limit_conn_status 429;
    limit_req_status 429;
    # Avoid logging URLs, cookies, IPs or document/license request payloads.
    access_log off;
    location /api/ {
        limit_req zone=scopeledger_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host scopeledger.site;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host scopeledger.site;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
