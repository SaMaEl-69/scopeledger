<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/brand/scopeledger-favicon.svg?v=6" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="ScopeLedger commercial project workspace for scope, pricing, approvals, invoices and payments."
    />
    <link rel="canonical" href="https://scopeledger.site/workspace/" />
    <meta property="og:site_name" content="ScopeLedger" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scopeledger.site/workspace/" />
    <meta property="og:title" content="ScopeLedger · Project workspace" />
    <meta
      property="og:description"
      content="Review scope, pricing and approvals, then preserve client documents in your local project workspace."
    />
    <title>ScopeLedger · Project workspace</title>
    <script>
      (function () {
        var preference = 'system';
        try {
          var saved = localStorage.getItem('sl-theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch (error) {}
        var theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.background = theme === 'light' ? '#f5f5f2' : '#08090a';
        document.querySelector('meta[name="theme-color"]').content = root.style.background;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
