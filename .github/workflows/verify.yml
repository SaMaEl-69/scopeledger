name: Verify application and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/check-source.mjs
      - name: Scan repository history for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner --timeout=120
      - run: npm test
      - run: npm run test:security-http
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Select sandboxed browser runtime
        run: |
          node --input-type=module -e "import { chromium } from 'playwright'; const p=chromium.executablePath(); console.log('PLAYWRIGHT_CHROME_PATH='+p); console.log('SCOPELEDGER_CHROME_PATH='+p)" >> "$GITHUB_ENV"
      - run: npm run test:local-browser
      - name: Verify social previews and public crawler access
        run: node scripts/sharing-qa.mjs
      - name: Verify HTTPS reverse proxy and security gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx openssl
          node scripts/nginx-security-qa.mjs output/security/nginx-results.json
      - run: npm run test:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: verification-failures
          path: test-results/
          retention-days: 7
