name: Verify application and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/check-source.mjs
      - run: npm test
      - run: npm run test:security-http
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Select sandboxed browser runtime
        run: |
          node --input-type=module -e "import { chromium } from 'playwright'; const p=chromium.executablePath(); console.log('PLAYWRIGHT_CHROME_PATH='+p); console.log('SCOPELEDGER_CHROME_PATH='+p)" >> "$GITHUB_ENV"
      - run: npm run test:local-browser
      - run: npm run test:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: verification-failures
          path: test-results/
          retention-days: 7
